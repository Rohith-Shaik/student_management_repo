
{% extends 'students/base.html' %}

{% block title %}Student Login{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card shadow">
                <div class="card-header text-center">
                    <h3 class="mb-0">Student Login</h3>
                </div>

                <div class="card-body p-4">

                    <p class="text-muted text-center mb-4">
                        Sign in to access your student account.
                    </p>

                    <form method="post" action="">
                        {% csrf_token %}

                        <input type="hidden" name="next" value="{{ next }}">

                        <div class="mb-3">
                            <label for="username" class="form-label">
                                Username
                            </label>
                            <input
                                type="text"
                                name="username"
                                id="username"
                                class="form-control"
                                autocomplete="username"
                                required
                                autofocus>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">
                                Password
                            </label>
                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                autocomplete="current-password"
                                required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>

                    <hr>

                    <p class="text-center mb-0">
                        Are you an administrator?
                        <a href="{% url 'admin_login' %}">
                            Admin Login
                        </a>
                    </p>
                    <p class="text-center mb-2">
                        New student?
                        <a href="{% url 'students:register' %}">
                            New Student Registration
                        </a>
                    </p>
                    <div class="text-center mt-3">
                        <a href="{% url 'students:student_password_reset' %}">
                            Forgot Student Password?
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
